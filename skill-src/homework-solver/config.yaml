# C4C homework-solver 默认配置
# ---------------------------------------------------------------------------
# 命令行参数优先于本文件。要换成自己的课程，改这里，或者直接传 --course/--student。
# 也可以复制一份 config.local.yaml（已被 .gitignore 忽略）放个人信息。

# ── 作业模板信息（会印在生成的 PDF 抬头）──────────────────────────────
course: "Mathematics"
student: "Student"
title: "Homework Solutions"

# ── 国产大模型 ────────────────────────────────────────────────────────
# provider 留空 = 自动探测（按 deepseek → qwen → kimi 的顺序看哪个有 API Key）。
# 可选值: deepseek | qwen | kimi | openai-compatible
llm:
  provider: ""            # 例: "deepseek"
  model: ""               # 例: "deepseek-chat" / "deepseek-reasoner"
  # API Key 从环境变量读，**不要写在这里**：
  #   deepseek → DEEPSEEK_API_KEY
  #   qwen     → DASHSCOPE_API_KEY
  #   kimi     → MOONSHOT_API_KEY
  # 自建/其他 OpenAI 兼容端点 → LLM_API_KEY + LLM_BASE_URL
  temperature: 0.0
  timeout: 180
  min_confidence: 0.4     # 低于这个置信度 → 标为「未解」，宁可少答不要错答
  verify_with_llm: false  # true = 让模型独立重算一遍做二次复核（更慢）
  cache: true             # 响应落盘缓存，保证可复现；离线也能重跑

# ── PDF 编译策略 ──────────────────────────────────────────────────────
# auto = 依次尝试 latex → browser → reportlab，用第一个成功的
#   latex     本机装了 TeX Live/MiKTeX/TinyTeX（质量最好）
#   browser   Edge / Chrome / Chromium headless + 本地 MathJax（零额外安装）
#   reportlab 纯 Python，公式降级成 Unicode 文本（最后兜底）
pdf:
  tier: "auto"

# ── 输出 ──────────────────────────────────────────────────────────────
output:
  basename: "homework"
  embed_mathjax: true     # HTML 内联 MathJax（单文件，方便发给别人）
